<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App — Reep</title>
<meta name="description" content="Reep live dashboard: secure your vault, manage guardians, set beneficiaries, and monitor your heartbeat status.">
<link rel="canonical" href="https://reep.app/app.html">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">

      </a>
      <a href="#" data-section="heartbeat">
        <svg class="app-nav-icon" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>

        Security
      </a>

  <main class="app-main">

      <div class="app-header-left">
        <button class="app-mobile-toggle" onclick="toggleMobileSidebar()" aria-label="Open menu">☰</button>
        <div>
          <h1 style="font-size:1.1rem;font-weight:600;color:var(--ink);font-family:var(--font-display);">Reep Vault</h1>
          <p style="font-size:0.78rem;color:var(--slate-dim);font-family:var(--font-mono);">user@vault.reep.app</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:1rem;">
        <span class="status-pill live"><span class="status-dot live"></span> Live</span>
        <a href="index.html" class="btn btn-sm btn-secondary">Back to site</a>

    </header>

    <div class="app-content" id="appMainContent">
      <!-- Rendered by js/app.js -->
    </div>

    <footer class="app-footer">
      <div>
        <span style="font-weight:600;color:var(--ink);">Reep Tech Ltd</span> · Hilltop, Nsukka, Nigeria · <a href="mailto:hello@reep.cc" style="color:var(--continuity-deep);text-decoration:underline;">hello@reep.cc</a>

</div>

<script src="js/app.js"></script>
